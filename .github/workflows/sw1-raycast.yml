  face-followup:
    name: sw1 face-height follow-up (read-only)
    if: ${{ inputs.mode == 'face-followup' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes (cfgrib's GRIB-2 backend for NWPS) and unzip
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libeccodes0 unzip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Restore geodata cache
        id: geodata-cache
        uses: actions/cache@v6
        with:
          path: pipeline/geodata
          key: geodata-v1-${{ hashFiles('pipeline/download_geodata.sh') }}

      - name: Download GSHHG (only if cache missed)
        if: steps.geodata-cache.outputs.cache-hit != 'true'
        run: bash pipeline/download_geodata.sh

      - name: Run 48's follow-up (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m pipeline.face_followup --out face_followup.json --csv-dir face_followup

