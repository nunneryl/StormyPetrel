name: sw1-raycast

# Dedicated, manually-triggered job for the SW-1 swell-window raycast.
#
# The raycast needs the real GSHHG L1 land mask (~150 MB) and more wall-clock
# than the normal pipeline allows, and there is no enrich step in any cron, so
# it lives here. A GitHub-hosted runner has the open egress to download GSHHG
# and the headroom to run longer.
#
#   mode = validate (default): cast ONLY the 5 Phase-0 gate spots against GSHHG
#       and print width / ceiling / arcs / optimal to the job log. Writes
#       nothing. This is the gate — review the numbers (and re-tune thresholds
#       against GSHHG if needed) BEFORE running full.
#   mode = full: cast the whole roster with the perf path, write the swell
#       fields into spots_enriched.json for spots the raycast solves (leaving
#       the orientation-derived fallback for the rest), and commit the result
#       on a review branch (NEVER main) so the diff is reviewed before merge.
#       With then_enrich (default on) it then runs `enrich --skip-raycast` over
#       the result and commits that SEPARATELY on the same branch, so the hand
#       overrides in spot_swell_windows.json (Algo 2d, with their arc pruning)
#       land on the new arcs and the two diffs can be reviewed apart.
#       With then_preview (default on), after the push it prints the before-and-after
#       counts against the roster this run started from, runs --debug-blockers on every
#       spot whose facing is still outside every arc, and runs the read-only star
#       preview of the new roster against main's (the one the published window used).
#   mode = star-preview: READ-ONLY. Score the published forecast window with
#       the swell windows in another spots file (pipeline/star_preview.py) and
#       print stars before vs after. Uses the Supabase secrets to SELECT only;
#       writes nothing anywhere but the job log and its artifact.
#   mode = tide-preview: READ-ONLY. A census of spots.tide_preference and its source, and
#       the published window re-scored with every unverified tide preference (no cited
#       source) treated as neutral, or damped (pipeline/star_preview.py --tide). The swell
#       window is held at main's roster, the one the window was rated with. SELECT only.
#   mode = nwps-shelter: READ-ONLY. On the published NWPS rows, how often the swell window
#       cuts a partition the NWPS node already delivers with real energy (R_rel by period
#       band, state, rung and node distance), and the stars with no window gate on NWPS rows
#       (pipeline/star_preview.py --nwps-shelter), then replays B and C: the window picks the
#       partition but the height takes the alignment term only (C: on NWPS dirpw), all three
#       on the same rows read once. Geometry from baseline_ref. SELECT only.
#   mode = rating-preview: READ-ONLY. An onshore cap rung at the "Blown out" label's threshold
#       (6 m/s), against the wired rater, replayed over the window from 2026-10-23 00:00Z:
#       blown-2.5 (2.5 from 6 m/s, over 15 kt 2.0, over 20 kt 1.5, with the period allowance as
#       today) and blown-2.5-measured (the 6 m/s rung read at the measured speed; the rungs
#       over 15 and 20 kt keep the allowance); each by state and wind band, the "Blown out"
#       hours above 2.5 stars under today's label (6 m/s) and a 15 kt label, the hours whose
#       label would change, every changed hour at the spots in `spots`, the next hour's caps
#       and labels there, and the homepage's "Best conditions right now" (from now) before and
#       after (pipeline/star_preview.py --onshore --explain).
#       Geometry from baseline_ref. SELECT only.
#   mode = data-quality: READ-ONLY. The data-quality sweep (pipeline/data_quality.py): every
#       CONUS spot's HRRR cell and whether HRRR classes it as land, with the nearest seaward water
#       cell and the wind at both (HRRR from NOAA's AWS archive); THE HRRR WIND GATE, the
#       pipeline's forecast/hrrr.py on the newest cycle (land-cell spots on the seaward water
#       cell, turned to true north) against the sweep's own wind, spot by spot and hour by hour
#       (must be 0 differences); the published HRRR hours
#       re-rated with the water cell's wind and with the wind turned from HRRR's grid to true
#       north, and on the wired rater, whose cap reads cross-offshore as offshore, with THE
#       CAP90 GATE, the wired rater against the rule built in the sweep (must be 0
#       differences); the Swell breakdown card hour by hour at the spots in `spots`; every spot's tide
#       station against the stations within 30 km (damped stations flagged, re-rated where the
#       spot has a rated preference); and the cams with no spot. Window from 2026-10-21 00:00Z.
#       Geometry from baseline_ref. SELECT only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: validate (5-spot gate, no writes) or full (whole roster, commits a review branch)
        required: true
        default: validate
        type: choice
        options:
          - validate
          - full
          - star-preview
          - tide-preview
          - nwps-shelter
          - rating-preview
          - data-quality
      workers:
        description: (full only) parallel worker processes
        required: false
        default: '4'
        type: string
      debug_blockers:
        description: (validate only) dump the per-ray blocker/culprit breakdown to the log
        required: false
        default: true
        type: boolean
      sweep_mainland_solid:
        description: (validate only) sweep SWELL_MAINLAND_SOLID_KM (60/80/100/120/150 km) and print width-per-spot
        required: false
        default: false
        type: boolean
      spots:
        description: (validate) spot slugs to debug instead of the 5-spot gate; (rating-preview) spot slugs whose rating factors to print. Comma-separated
        required: false
        default: ''
        type: string
      then_enrich:
        description: (full only) run enrich --skip-raycast after the raycast and commit it separately
        required: false
        default: true
        type: boolean
      then_preview:
        description: (full only) after pushing, run --debug-blockers on spots whose facing is outside every arc, and the read-only star preview
        required: false
        default: true
        type: boolean
      arcs_ref:
        description: (star-preview only) git ref whose pipeline/spots_enriched.json to preview (blank = the ref this run is on)
        required: false
        default: ''
        type: string
      baseline_ref:
        description: (star-preview, tide-preview and nwps-shelter) git ref whose roster the published window was rated with
        required: false
        default: main
        type: string
      tide_modes:
        description: "(tide-preview only) comma-separated: keep, neutral, damp:K (0 < K < 1, the share of the penalty kept), rated (the rater's own rule)"
        required: false
        default: neutral,damp:0.5
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: sw1-raycast
  cancel-in-progress: false

jobs:
  raycast:
    name: sw1 raycast (${{ inputs.mode }})
    if: ${{ inputs.mode != 'star-preview' && inputs.mode != 'tide-preview' && inputs.mode != 'nwps-shelter' && inputs.mode != 'rating-preview' && inputs.mode != 'data-quality' }}
    runs-on: ubuntu-24.04
    # Comfortably under the 6 h platform hard cap. validate is minutes; full is
    # ~30–60 min with the perf path (4° / 90 rays + prepared geoms + per-spot
    # bbox pre-clip + multiprocessing).
    timeout-minutes: 350
    permissions:
      # full mode pushes the result branch with the default GITHUB_TOKEN.
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install geo deps + unzip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends unzip
          # Only the raycast's geo stack — no eccodes/cfgrib needed here.
          pip install 'shapely>=2,<3' 'pyproj>=3.6,<4' 'fiona>=1.9,<2' 'numpy>=1.26,<3'

      - name: Restore geodata cache
        id: geodata-cache
        uses: actions/cache@v6
        with:
          path: pipeline/geodata
          key: geodata-v1-${{ hashFiles('pipeline/download_geodata.sh') }}

      - name: Download GSHHG (only if cache missed)
        if: steps.geodata-cache.outputs.cache-hit != 'true'
        run: bash pipeline/download_geodata.sh

      - name: Verify GSHHG L1 is present (hard fail if every mirror was down)
        run: |
          if [[ ! -s pipeline/geodata/GSHHS_f_L1.shp ]]; then
            echo "::error::GSHHG L1 shapefile missing — every download mirror failed."
            echo "The raycast cannot run without it. Re-run once a GSHHG mirror is reachable,"
            echo "or add another mirror to pipeline/download_geodata.sh."
            exit 1
          fi
          ls -lh pipeline/geodata/GSHHS_f_L1.*

      # Exits 1 when a regression check (sw1_raycast.REGRESSION_CHECKS) fails for a cast spot.
      - name: Validate — 5-spot gate against GSHHG (no writes)
        if: ${{ inputs.mode == 'validate' }}
        env:
          # Pass the free-text slug list through the environment (never interpolated into
          # the shell command) so an arbitrary --spots value can't inject shell.
          SW1_SPOTS: ${{ inputs.spots }}
        run: |
          python -m pipeline.sw1_raycast --mode validate \
            ${{ inputs.debug_blockers && '--debug-blockers' || '' }} \
            ${{ inputs.sweep_mainland_solid && '--sweep-mainland-solid' || '' }} \
            ${{ inputs.spots != '' && '--spots "$SW1_SPOTS"' || '' }}

      - name: Full — raycast the whole roster
        if: ${{ inputs.mode == 'full' }}
        run: python -m pipeline.sw1_raycast --mode full --workers "${{ inputs.workers }}"

      - name: Commit roster arcs on a review branch (never main)
        if: ${{ inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          BR="sw1-raycast/full-${{ github.run_number }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          if git diff --quiet -- pipeline/spots_enriched.json; then
            echo "::warning::No change to spots_enriched.json from the raycast."
          else
            git add pipeline/spots_enriched.json
            git commit -m "SW-1 Phase 1: raycast swell windows over full roster (run ${{ github.run_number }})

          Generated by .github/workflows/sw1-raycast.yml (mode=full). Review the
          spots_enriched.json diff before merging; orientation_deg is untouched."
          fi

      - name: Install the enrich / report / preview dependencies
        if: ${{ inputs.mode == 'full' && (inputs.then_enrich || inputs.then_preview) }}
        run: pip install -r pipeline/requirements.txt

      - name: Enrich --skip-raycast over the new arcs (hand overrides + pruning)
        if: ${{ inputs.mode == 'full' && inputs.then_enrich }}
        run: |
          set -euo pipefail
          python -m pipeline.enrich --skip-raycast
          if git diff --quiet -- pipeline/spots_enriched.json; then
            echo "::warning::enrich --skip-raycast changed nothing."
          else
            git add pipeline/spots_enriched.json
            git commit -m "enrich --skip-raycast over the run ${{ github.run_number }} arcs

          Generated by .github/workflows/sw1-raycast.yml (mode=full, then_enrich). Carries
          the raycast arcs forward and applies the slug-keyed overrides, including
          spot_swell_windows.json (Algo 2d) and its arc pruning. Committed apart from the
          raycast so this diff can be read on its own."
          fi

      - name: Push the review branch
        if: ${{ inputs.mode == 'full' }}
        run: |
          set -euo pipefail
          BR="sw1-raycast/full-${{ github.run_number }}"
          if [[ "$(git rev-list --count HEAD ^"${{ github.sha }}")" == "0" ]]; then
            echo "::warning::Nothing committed — no branch pushed."
            exit 0
          fi
          git push -u origin "$BR"
          echo "::notice::Pushed branch $BR — open a PR to review the spots_enriched.json diff before merge."

      - name: Before-and-after counts, and --debug-blockers where the facing is outside every arc
        if: ${{ inputs.mode == 'full' && inputs.then_preview }}
        run: |
          set -euo pipefail
          git show "${{ github.sha }}:pipeline/spots_enriched.json" > "$RUNNER_TEMP/before.json"
          python -m pipeline.swell_window_report --before "$RUNNER_TEMP/before.json" \
            --after pipeline/spots_enriched.json
          SLUGS="$(python -m pipeline.swell_window_report --before "$RUNNER_TEMP/before.json" \
            --after pipeline/spots_enriched.json --facing-outside)"
          echo "facing outside every arc: ${SLUGS:-none}"
          if [[ -n "$SLUGS" ]]; then
            # A failed regression check is reported, not fatal: the star preview still runs.
            python -m pipeline.sw1_raycast --mode validate --debug-blockers --spots "$SLUGS" \
              || echo "::warning::a regression check failed for a facing-outside spot (see above)"
          fi

      - name: Star preview of the new roster (SELECT only)
        if: ${{ inputs.mode == 'full' && inputs.then_preview }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # The baseline is main's roster — what the published window was rated with — not
          # the roster this run started from, which on a branch may already carry a previous
          # recompute (and then almost no published row would reproduce).
          git fetch --depth=1 origin main
          git show FETCH_HEAD:pipeline/spots_enriched.json > "$RUNNER_TEMP/published.json"
          python -m pipeline.star_preview --arcs pipeline/spots_enriched.json \
            --baseline "$RUNNER_TEMP/published.json" --out star_preview.json

      - name: Upload the star preview
        if: ${{ inputs.mode == 'full' && inputs.then_preview && always() }}
        uses: actions/upload-artifact@v7
        with:
          name: star-preview-${{ github.run_number }}
          path: star_preview.json
          if-no-files-found: warn

  star-preview:
    name: sw1 star preview (read-only)
    if: ${{ inputs.mode == 'star-preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve the two spots files
        env:
          # Through the environment, never interpolated into the shell command.
          ARCS_REF: ${{ inputs.arcs_ref }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          ref="${ARCS_REF:-HEAD}"
          base="${BASELINE_REF:-main}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          git rev-parse --verify --quiet "$ref^{commit}" >/dev/null || ref="origin/$ref"
          git show "$ref:pipeline/spots_enriched.json" > "$RUNNER_TEMP/arcs.json"
          git show "$base:pipeline/spots_enriched.json" > "$RUNNER_TEMP/baseline.json"
          echo "arcs:     $ref ($(git rev-parse "$ref"))"
          echo "baseline: $base ($(git rev-parse "$base"))"

      - name: Score the published window (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pipeline.star_preview --arcs "$RUNNER_TEMP/arcs.json" \
            --baseline "$RUNNER_TEMP/baseline.json" --out star_preview.json

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: star-preview-${{ github.run_number }}
          path: star_preview.json
          if-no-files-found: warn

  tide-preview:
    name: sw1 tide preview (read-only)
    if: ${{ inputs.mode == 'tide-preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve the roster the window was rated with
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          base="${BASELINE_REF:-main}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          git show "$base:pipeline/spots_enriched.json" > "$RUNNER_TEMP/baseline.json"
          echo "baseline: $base ($(git rev-parse "$base"))"

      - name: Tide census and preview of the published window (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Through the environment, never interpolated into the shell command.
          TIDE_MODES: ${{ inputs.tide_modes }}
        run: |
          # --tide-roster: the 'rated' mode reads the tide sources of the roster this run is on.
          python -m pipeline.star_preview --tide "${TIDE_MODES:-neutral,damp:0.5}" \
            --baseline "$RUNNER_TEMP/baseline.json" \
            --tide-roster pipeline/spots_enriched.json --out tide_preview.json

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: tide-preview-${{ github.run_number }}
          path: tide_preview.json
          if-no-files-found: warn

  nwps-shelter:
    name: sw1 NWPS shelter measurement (read-only)
    if: ${{ inputs.mode == 'nwps-shelter' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve the roster the window was rated with
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          base="${BASELINE_REF:-main}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          git show "$base:pipeline/spots_enriched.json" > "$RUNNER_TEMP/baseline.json"
          echo "baseline: $base ($(git rev-parse "$base"))"

      - name: Measure the window's cut on NWPS rows, and replay them with no window (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pipeline.star_preview --nwps-shelter \
            --baseline "$RUNNER_TEMP/baseline.json" --out nwps_shelter.json

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nwps-shelter-${{ github.run_number }}
          path: nwps_shelter.json
          if-no-files-found: warn

  rating-preview:
    name: sw1 rating preview (read-only)
    if: ${{ inputs.mode == 'rating-preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve the roster the window was rated with
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          base="${BASELINE_REF:-main}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          git show "$base:pipeline/spots_enriched.json" > "$RUNNER_TEMP/baseline.json"
          echo "baseline: $base ($(git rev-parse "$base"))"

      - name: An onshore cap rung at the Blown out label's threshold (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Through the environment, never interpolated into the shell command.
          SPOTS: ${{ inputs.spots }}
        run: |
          python -m pipeline.star_preview --onshore blown-2.5,blown-2.5-measured \
            --since 2026-10-23T00:00:00+00:00 \
            --explain "${SPOTS:-indialantic,cocoa-beach-pier,jacksonville-beach-pier,kitty-hawk-pier,ocean-city-nj}" \
            --baseline "$RUNNER_TEMP/baseline.json" --out rating_preview.json

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: rating-preview-${{ github.run_number }}
          path: rating_preview.json
          if-no-files-found: warn

  data-quality:
    name: sw1 data-quality sweep (read-only)
    if: ${{ inputs.mode == 'data-quality' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes (cfgrib's GRIB-2 backend for HRRR)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Resolve the roster the window was rated with
        env:
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          base="${BASELINE_REF:-main}"
          git rev-parse --verify --quiet "$base^{commit}" >/dev/null || base="origin/$base"
          git show "$base:pipeline/spots_enriched.json" > "$RUNNER_TEMP/baseline.json"
          echo "baseline: $base ($(git rev-parse "$base"))"

      - name: Data-quality sweep (SELECT only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Through the environment, never interpolated into the shell command.
          SPOTS: ${{ inputs.spots }}
        run: |
          python -m pipeline.data_quality --sections hrrr,true-north,wind-preview,partitions,tides,cams \
            --since 2026-10-21T00:00:00+00:00 \
            --explain "${SPOTS:-ventnor-pier,indialantic,atlantic-city,margate-pier,ocean-city-nj}" \
            --baseline "$RUNNER_TEMP/baseline.json" --workdir "$RUNNER_TEMP/dq" --out data_quality.json

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: data-quality-${{ github.run_number }}
          path: data_quality.json
          if-no-files-found: warn
