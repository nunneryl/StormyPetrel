name: forecast-pipeline

# Two jobs in one workflow:
#   - full-pipeline   four times a day, at the slots in DISPATCH_SLOTS below (01:45 / 08:15 /
#                     13:45 / 20:15 UTC): the full NWPS + WW3 + HRRR + buoys + tides fetch +
#                     interpret + Supabase push. The slots land just after most NWPS offices
#                     publish each cycle; docs/scheduling.md has the measurement behind them.
#   - buoy-update     every hour on the hour. NDBC publishes obs every 30–60 min, so a 1-hour
#                     cadence keeps the "now" reading near-real-time. Only / and /map are
#                     revalidated so spot pages aren't touched.
#
# WHO STARTS THEM. An outside scheduler (cron-job.org) calls workflow_dispatch at each slot
# with trigger: external — GitHub's own scheduler started full runs a median 4.4 h late over
# 30 days and ran the hourly job in only 22% of hours, while a dispatch starts within seconds.
# GitHub's cron below is kept only as a FALLBACK, 20 minutes after each slot. The gate job
# (scripts/dispatch_gate.py) skips a scheduled or external run when an earlier run of the same
# job already covers its slot, so a late cron run never repeats a dispatched one. A manual run
# from the Actions tab (trigger: manual, the default) always goes ahead.
#
# docs/scheduling.md holds the cron-job.org jobs and the Healthchecks.io settings. Change a slot
# in DISPATCH_SLOTS, the fallback crons, the full-pipeline if: and there, together;
# pipeline/tests/test_dispatch_gate.py fails until they agree.

# The run's title begins with its logical job, because the gate reads it back from the runs list
# (which carries neither the inputs nor the cron string) to tell the two jobs' runs apart.
run-name: ${{ (github.event.schedule == '0 * * * *' || inputs.job == 'buoy-update') && 'buoy-update' || 'full-pipeline' }} (${{ github.event_name == 'workflow_dispatch' && inputs.trigger || github.event_name }})

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        required: true
        default: full-pipeline
        type: choice
        options:
          - full-pipeline
          - buoy-update
      trigger:
        description: Who is starting it. Leave manual; the outside scheduler sends external
        required: false
        default: manual
        type: choice
        options:
          - manual
          - external
  schedule:
    # FALLBACK ONLY, 20 minutes after each slot in DISPATCH_SLOTS (01:45 08:15 13:45 20:15):
    # 02:05 and 14:05, then 08:35 and 20:35. The dispatched run normally covers the slot first
    # and the gate skips these; when the outside scheduler is down, they still run, late.
    - cron: '5 2,14 * * *'
    - cron: '35 8,20 * * *'
    # Buoy refresh hourly, also dispatched from outside; this is its gated fallback.
    - cron: '0 * * * *'

# Opt JavaScript-based actions (checkout, setup-python, github-script,
# cache) onto the Node.js 24 runner. Node 20 is deprecated and gets
# removed from GitHub-hosted runners 2026-09-16; flipping this now
# silences the deprecation warning and tracks the new default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # The full pipeline's slots, UTC, the one place they are held. The gate reads them; the
  # fallback crons above sit 20 minutes after each; docs/scheduling.md lists the cron-job.org
  # jobs that dispatch them.
  DISPATCH_SLOTS: '01:45 08:15 13:45 20:15'

# One run at a time per LOGICAL JOB, whoever started it. This was keyed on
# `github.event.schedule || inputs.job`, which put a scheduled full run (group '30 3,11,19 * * *')
# and a dispatched one (group 'full-pipeline') in different groups, so the two could run at once.
# Now both name the job. A run that arrives while one is going waits (cancel-in-progress=false
# avoids killing a healthy run mid-upload), and its gate then sees the finished run.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event.schedule == '0 * * * *' || inputs.job == 'buoy-update') && 'buoy-update' || 'full-pipeline' }}
  cancel-in-progress: false

# Read-only by default, so no job holds a scope it was never given on purpose. The
# failure-issue job at the end is the only one that may write, and only to issues.
permissions:
  contents: read

jobs:
  gate:
    # Skips a scheduled or external run that an earlier run already covers; see
    # scripts/dispatch_gate.py. It FAILS OPEN: the script always exits 0 and answers "run" when
    # it cannot decide, the step is continue-on-error, and the jobs below go ahead unless the
    # answer is exactly 'false' — so a broken gate costs at most a duplicate run, never a slot.
    name: gate (skip a run another run already covers)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read               # this workflow's runs list
      contents: read              # checkout of the gate script
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout the gate script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Decide whether this run goes ahead
        id: decide
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GATE_JOB: ${{ (github.event.schedule == '0 * * * *' || inputs.job == 'buoy-update') && 'buoy-update' || 'full-pipeline' }}
          GATE_TRIGGER: ${{ inputs.trigger }}
        run: python3 scripts/dispatch_gate.py

  full-pipeline:
    name: full-pipeline (NWPS + WW3 + HRRR + buoys + tides)
    needs: gate
    # !cancelled() so a failed gate job still lets the run through (fail open).
    if: |
      !cancelled() && needs.gate.outputs.run != 'false' && (
        (github.event_name == 'schedule' &&
          (github.event.schedule == '5 2,14 * * *' || github.event.schedule == '35 8,20 * * *')) ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'full-pipeline'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # contents:read for the checkout. Nothing in this job writes to issues: the
    # failure-issue job at the end of this file reports a failure.
    permissions:
      contents: read
    # The column check's line, for the failure issue (set only when the job failed).
    outputs:
      failure-note: ${{ steps.failure-note.outputs.note }}
    env:
      # supabase-py reads SUPABASE_URL / SUPABASE_SERVICE_KEY; mirror to
      # NEXT_PUBLIC_SUPABASE_URL too so any code that reads either works.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      REVALIDATE_URL: https://stormypetrel.surf/api/revalidate
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      # Don't buffer Python output — make logs visible in real time so a
      # stuck step is debuggable from the live Actions tail.
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # Where the column preflight writes what it found. Set for the whole job so the preflight,
      # db_import and the last step all read one file (see pipeline/column_preflight.py).
      COLUMN_PREFLIGHT_RESULT: pipeline/forecast_data/column_preflight.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes (cfgrib's GRIB-2 backend)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0 unzip

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Check the live tables have every column db_import writes
        # Before the fetch, so a migration that was never applied is named at the top of the log:
        # each missing column, with the file in pipeline/migrations/ that adds it. db_import then
        # leaves exactly those columns out and uploads everything else, and the last step below
        # fails the run. This step never stops the run; continue-on-error means not even a crash
        # here can, and the last step then says the check did not run.
        continue-on-error: true
        run: python -m pipeline.column_preflight --all

      - name: Restore geodata cache
        id: geodata-cache
        uses: actions/cache@v6
        with:
          path: pipeline/geodata
          # Keyed on the script content — bump key automatically when the
          # download list changes.
          key: geodata-v1-${{ hashFiles('pipeline/download_geodata.sh') }}

      - name: Download geodata (only if cache missed)
        if: steps.geodata-cache.outputs.cache-hit != 'true'
        run: bash pipeline/download_geodata.sh

      - name: Create runtime directories
        run: mkdir -p pipeline/cache/tides pipeline/forecast_data

      # Tide cache persists across runs. Harmonic predictions are DETERMINISTIC, so a warm 30-day
      # cache means a run refetches only the handful of stations whose horizon is expiring — not all
      # ~230 (on a cold CI runner every run is a full 232-station refetch, since pipeline/cache is
      # gitignored + ephemeral). Same restore/save shape as reverify-trust-accumulate.yml.
      #
      # KEY IS PER-DATE, NOT PER-RUN. A per-run key (github.run_id) minted a fresh ~8 MiB cache entry
      # on EVERY run — 4 full-pipeline runs/day, forever. Those entries compete under GitHub's 10 GB
      # per-repo LRU cap with the nwps-trust-history cache, and trust history is IRREPLACEABLE (NOMADS
      # retains ~5 days; a lost direction event cannot be backfilled) while this tide cache is fully
      # regenerable — so we must not churn disposable entries that could evict the irreplaceable one.
      # A per-UTC-date key mints at most ONE entry/day: each later run that day restores it on an
      # exact-key hit and its save no-ops ("cache already exists"). Freezing the day's entry at the
      # first run's state is harmless — the 30-day horizon only needs a refetch ~every 23 days per
      # station, so a few un-persisted intra-day refreshes cost only repeat fetches, never correctness.
      # (The GITHUB_OUTPUT step exists because the Actions expression language has no date function.)
      # Cache contents are NOT committed to the repo.
      - name: Compute tide cache key (per UTC date)
        id: tide-cache-key
        run: echo "key=tide-cache-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore tide prediction cache
        uses: actions/cache/restore@v6
        with:
          path: pipeline/cache/tides
          key: ${{ steps.tide-cache-key.outputs.key }}
          restore-keys: |
            tide-cache-

      - name: Fetch all forecast / observation sources
        # STEP-level timeout inside the 60-min JOB backstop. This is the load-bearing distinction: a
        # STEP timeout is a step FAILURE that the !cancelled() steps below survive, whereas a JOB
        # timeout CANCELS the job and !cancelled() does NOT run. Bounds any hung fetcher (not just
        # tides, which is already self-bounded) so db_import still ships.
        timeout-minutes: 35
        run: python -m pipeline.forecast.fetch_all

      - name: Save tide prediction cache
        if: always()   # persist new/refreshed cache entries even if a later fetcher failed / timed out
        uses: actions/cache/save@v6
        with:
          path: pipeline/cache/tides
          # Per-date key: the first run of the day creates it; a later run the same day hits the
          # exact key on restore and this save is a harmless no-op ("cache already exists", not a
          # failure — so if: always() stays green).
          key: ${{ steps.tide-cache-key.outputs.key }}

      - name: Interpret (compute ratings)
        if: ${{ !cancelled() }}   # run even if a fetcher failed — ship ratings from whatever we have
        run: python -m pipeline.interpret

      - name: Snapshot pre-write spot ratings (for diff in revalidate step)
        run: python -m pipeline.revalidate --snapshot pipeline/forecast_data/ratings_snapshot.json

      - name: Push to Supabase (spots + forecasts + buoys + tides)
        # !cancelled() so a STEP failure above (e.g. the fetch_all step timeout) still ships spot +
        # NWPS + whatever-was-fetched data. db_import skips any missing forecast file rather than
        # crashing (import_forecasts / import_buoys / import_tides guard a missing input).
        if: ${{ !cancelled() }}
        run: python -m pipeline.db_import --all

      - name: Revalidate ISR cache (home + map + regions + CHANGED spot pages only)
        run: python -m pipeline.revalidate --scope full --diff-from pipeline/forecast_data/ratings_snapshot.json

      - name: Fail the run if a database column was missing
        # The LAST step that does anything, after every upload and the revalidation, so it can
        # never stop one of them. !cancelled() so it still reports after an earlier step failed.
        # Exits 1 with one line naming the missing columns and their migrations; exits 0, silent,
        # when nothing was missing.
        if: ${{ !cancelled() }}
        run: python -m pipeline.column_preflight --finish

      - name: Ping the dead-man's switch (healthchecks.io)
        # Only after a run in which every step succeeded, the column check above included.
        # Healthchecks.io emails when no ping arrives for Period 7 h + Grace 1 h
        # (docs/scheduling.md), which catches the one thing the failure issue cannot: no run at
        # all. continue-on-error and a short timeout, so the ping can never fail or hold up the
        # run. The secret is unset until the check exists; the step then says so and does nothing.
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_FULL_PIPELINE_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_URL" ]; then
            echo "HEALTHCHECKS_FULL_PIPELINE_URL is not set: no ping sent."
            exit 0
          fi
          curl -fsS -m 10 --retry 5 --retry-all-errors -o /dev/null "$HEALTHCHECKS_URL"
          echo "Pinged healthchecks.io."

      - name: Hand the column check's line to the failure issue
        # Only when the job failed. The preflight's one-line reason, if it found anything,
        # becomes this job's failure-note output, and the failure-issue job quotes it under
        # this job. Reads the preflight's file and nothing else; it cannot fail the run.
        id: failure-note
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          try:
              with open(os.environ["COLUMN_PREFLIGHT_RESULT"], encoding="utf-8") as f:
                  reason = json.load(f).get("reason") or ""
          except Exception:
              reason = ""
          if reason:
              print("note=" + " ".join(str(reason).split()))
          PY

  buoy-update:
    name: buoy-update (hourly NDBC refresh)
    needs: gate
    if: |
      !cancelled() && needs.gate.outputs.run != 'false' && (
        (github.event_name == 'schedule' && github.event.schedule == '0 * * * *') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'buoy-update'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      failure-note: ${{ steps.failure-note.outputs.note }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      REVALIDATE_URL: https://stormypetrel.surf/api/revalidate
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      COLUMN_PREFLIGHT_RESULT: pipeline/forecast_data/column_preflight.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Check the live tables have every column db_import writes
        # Same check as full-pipeline's, for the one table this job writes. Never stops the run.
        continue-on-error: true
        run: python -m pipeline.column_preflight --buoys-only

      - name: Create runtime directories
        run: mkdir -p pipeline/cache pipeline/forecast_data

      - name: Fetch buoy observations
        run: python -m pipeline.forecast.fetch_all --only buoys --no-cache

      - name: Push buoy_observations to Supabase
        run: python -m pipeline.db_import --buoys-only

      - name: Revalidate ISR cache (home + map)
        run: python -m pipeline.revalidate --scope buoys

      - name: Fail the run if a database column was missing
        # Last, after the upload and the revalidation; see full-pipeline's step of the same name.
        if: ${{ !cancelled() }}
        run: python -m pipeline.column_preflight --finish

      - name: Hand the column check's line to the failure issue
        # As in full-pipeline: only when the job failed, and it cannot fail the run.
        id: failure-note
        if: failure()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          try:
              with open(os.environ["COLUMN_PREFLIGHT_RESULT"], encoding="utf-8") as f:
                  reason = json.load(f).get("reason") or ""
          except Exception:
              reason = ""
          if reason:
              print("note=" + " ".join(str(reason).split()))
          PY

  failure-issue:
    # This workflow's one failure issue, kept by .github/actions/failure-issue. It runs after
    # every other job whatever their result, so a timeout is reported too.
    # gate succeeding with both jobs skipped (a run the gate turned away) reports nothing.
    needs: [gate, full-pipeline, buoy-update]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read               # the failing step's name, from the run's job list
      contents: read              # checkout of the shared action
      issues: write               # open, comment on and close the failure issue
    concurrency:
      # One report at a time per workflow, so two runs failing together cannot open two.
      group: failure-issue-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Checkout the shared action
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/failure-issue
          persist-credentials: false

      - name: Report to the failure issue
        uses: ./.github/actions/failure-issue
        with:
          needs: ${{ toJSON(needs) }}
