name: archive-partitions

# Scheduled CAPTURE of partitioned wave data into Supabase `partition_archive`, so that a
# year from now the P3-2 design question — which partition-selection rule actually tracks
# the buoy — can be settled EMPIRICALLY instead of argued.
#
# THE CLOCK IS THE WHOLE POINT: NOMADS retains only ~5 days of cycles (confirmed by
# directory listing — 20260806-20260810 populated, everything older empty). An hour not
# captured inside that window is PERMANENTLY UNRECOVERABLE. That is why this runs on a
# schedule rather than on demand, and why a partial failure must never stop the rest of the
# run from capturing what it still can.
#
# HARD BOUNDARIES (capture only, by construction):
#   * Writes exactly ONE table, `partition_archive`. NEVER modifies a rating, a trust
#     verdict, trust_by_zone, an assignment, spots_enriched.json, or any other DB table.
#   * Commits NOTHING — hence `contents: read` only, no issues: write, no cache. The
#     archive lives in Supabase, so there is no repo state to carry between runs (the
#     contrast with reverify-trust-accumulate.yml, whose rolling history MUST be cached).
#   * Does not create its table. The table is created by hand; a missing table or a missing
#     UNIQUE (valid_hour, wfo, buoy_id, source) constraint FAILS THE RUN LOUDLY with the DDL
#     to apply, rather than silently inserting duplicates on every schedule tick.
#
# Idempotence: every write upserts on (valid_hour, wfo, buoy_id, source, lead_hours), so a
# re-run replaces each row in place and overlapping schedules converge rather than fighting.
# lead_hours is IN the key deliberately — P3-2 is about forecast quality, so skill across
# lead times has to stay recoverable, and it cannot be backfilled once a cycle ages out of
# NOMADS. A repeated valid_hour in the archive therefore means "the same hour forecast at
# several leads", not a duplicate; a reader wanting one best estimate per hour takes the
# SHORTEST lead. Buoy rows carry lead_hours = 0 as a sentinel, never NULL, because a NULL in
# a Postgres unique key does not compare equal to another NULL and would stop deduplicating
# them entirely. This is what makes a twice-daily cadence with a 5-day backfill safe.
#
# Frequency — twice daily at 09:00 / 21:00 UTC. DELIBERATELY OFFSET by four hours from
# reverify-trust-accumulate.yml's 05:00 / 17:00 so the two jobs never contend for NOMADS:
# both pull CG1 GRIBs for the same ~11 real-buoy zones, and overlapping them would double
# the concurrent load on one origin for no benefit. Twice daily also means a single failed
# run loses nothing permanently — the next run's default backfill still sits inside the
# 5-day retention window.
#
# Graceful degradation (the reverify job's discipline, adopted verbatim): fetches are
# SINGLE-ATTEMPT with timeouts and no retry loops, every zone is wrapped so one failure
# prints a SKIP line instead of aborting, the run exits 0 on partial failure, and
# timeout-minutes is the hard backstop against a slow NOMADS.

on:
  schedule:
    - cron: '0 9,21 * * *'    # 09:00 & 21:00 UTC — offset 4 h from reverify's 05:00/17:00
  workflow_dispatch:          # manual run, e.g. the first --backfill 5 capture
    inputs:
      backfill:
        description: 'Days of NOMADS cycles to walk back (5 captures everything retained)'
        required: false
        default: '0'
      dry_run:
        description: 'Print what would be written and write nothing'
        type: boolean
        required: false
        default: false

env:
  # Opt JS actions (checkout / setup-python) onto Node 24, matching the other workflows
  # (Node 20 is being removed from runners).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# One run at a time; don't cancel a healthy run mid-fetch.
concurrency:
  group: archive-partitions
  cancel-in-progress: false

permissions:
  contents: read              # checkout only — this job commits nothing

jobs:
  archive:
    name: archive partitioned wave data (capture only)
    runs-on: ubuntu-latest
    # MEASURED, not guessed — record real numbers here so the next person changing this cap
    # is not reasoning from the cap itself:
    #   * 24 min — a --backfill 0 run of 26 zones BEFORE the per-WFO grouping (PR #158),
    #     when every zone refetched its own copy of the same GRIBs.
    #   * ~57 min — the FIRST live scheduled run, 2026-08-12. All 15 WFOs were written; the
    #     last write landed 09:57 UTC against a 09:00 trigger. It COMPLETED, so the runner
    #     most likely started late rather than the job being killed — but either reading
    #     leaves no margin under the old 50 min cap, which is why it is now 120.
    # WHERE THE TIME ACTUALLY GOES — and a wrong guess, recorded so it is not made again:
    #   HYPOTHESIS (WRONG): that PR #158's 1.73x cut in cycle fetches (26 zones -> 15 WFOs)
    #     under-delivered because the 26 NDBC buoy reads are PER ZONE and were left unchanged,
    #     so they must be a large share of the runtime.
    #   MEASURED at zone 46254, which FALSIFIES it: ndbc_spectral.by_hour took 1.5 s for 1093
    #     hours, and nwps_nearshore._buoy_hourly took 0.1 s. Across 26 zones that is roughly
    #     45 s in total — about 1% of a 57-minute run, not a large share of anything.
    #   THEREFORE the remaining time is GRIB FETCH + CFGRIB PARSE: 15 WFOs, several cycles
    #     each, two multi-megabyte GRIB files per cycle. PR #158 already addressed that as far
    #     as GROUPING can — every (wfo, cycle) pair is now fetched and parsed exactly once —
    #     so any further gain has to come from the per-file cost or from parallelism, not from
    #     removing duplicate work.
    #   DO NOT restructure the NDBC path to save 45 seconds. That is the trap this note exists
    #     to close; the hypothesis is kept rather than deleted because a recorded wrong guess
    #     stops the same guess being made a second time.
    # A --backfill 5 run multiplies the GRIB half by the cycles in the window, so it sits
    # well above the scheduled figure. The cap is a backstop against a slow NOMADS, not a
    # target: hitting it loses at most one tick, and the next run re-captures the window
    # inside NOMADS' ~5-day retention.
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'          # live logs so a stuck fetch is visible in the tail
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      # supabase-py reads SUPABASE_URL / SUPABASE_SERVICE_KEY; mirror to
      # NEXT_PUBLIC_SUPABASE_URL too so any code that reads either works.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install eccodes (cfgrib's GRIB-2 backend for the NWPS cycles)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libeccodes0

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch NDBC station roster (buoy lat/lng metadata for _buoy_latlng)
        # Bounded (two small files, at most 3 retries each) — not a storm. activestations.xml
        # is the roster _buoy_latlng resolves coordinates from; without it EVERY zone SKIPs
        # with a KeyError and the run captures nothing, so a failure here is warned about
        # loudly even though it is not fatal. latest_obs.txt is its companion:
        # load_ndbc_wave_stations() needs BOTH or it logs "NDBC files missing" and returns [].
        run: |
          mkdir -p pipeline/geodata
          curl -fsSL --retry 3 --retry-delay 5 \
            https://www.ndbc.noaa.gov/activestations.xml \
            -o pipeline/geodata/ndbc_stations.xml \
            || echo "::warning::NDBC roster fetch failed — every zone will SKIP and this run will archive nothing"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://www.ndbc.noaa.gov/data/latest_obs/latest_obs.txt \
            -o pipeline/geodata/ndbc_latest_obs.txt \
            || echo "::warning::NDBC latest_obs fetch failed — load_ndbc_wave_stations() will log NDBC files missing"

      - name: Archive partitions to Supabase
        # CAPTURE ONLY: writes `partition_archive` and nothing else. Exits 0 on partial
        # failure — the per-zone OK/SKIP lines are the audit trail. A missing table or
        # missing UNIQUE constraint is the one FATAL case, and it names the fix.
        run: |
          python3 scripts/archive_partitions.py \
            --backfill "${{ github.event.inputs.backfill || '0' }}" \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
